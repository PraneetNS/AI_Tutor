version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_tutor_db
    environment:
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_password
      POSTGRES_DB: ai_tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_user -d ai_tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_tutor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_tutor_backend
    environment:
      - DATABASE_URL=postgresql://tutor_user:tutor_password@postgres:5432/ai_tutor
      - REDIS_URL=redis://redis:6379/0
      - PRIMARY_PROVIDER=mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_tutor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
